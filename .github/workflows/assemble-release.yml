name: Assemble verified distribution packages
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out verified compiled payload and packaging tools
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: codex/release-payload-v1.0.0
          persist-credentials: false
      - name: Verify installed files and publish portable and local web archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: python Tools/assemble_github_release.py
